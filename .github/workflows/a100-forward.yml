name: A100 Forward Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '10 8 * * 1-5'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/a100-forward.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: a100-forward
  cancel-in-progress: false

jobs:
  run-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autonomous policy tests
        run: python -m unittest discover -s tests -v

      - name: A100 frozen preflight
        run: python scripts/preflight.py

      - name: Prepare runtime and restore account state
        run: |
          sudo mkdir -p /mnt/data/A100_complete_results /mnt/data/A100_v5_results /mnt/data/A100_v6_results /mnt/data/A100_v7_results /mnt/data/forward /mnt/data/state
          sudo chown -R $USER:$USER /mnt/data
          cp scripts/*.py /mnt/data/
          if [ -d state ]; then
            find state -maxdepth 1 -type f -print -exec cp -f {} /mnt/data/state/ \;
          fi

      - name: Download and validate HiThink full market data
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: python scripts/download_hithink.py

      - name: Build frozen A100 feature chain
        run: |
          cd /mnt/data
          python a100_canonical_prep.py
          python a100_v5_pit_proxy.py
          python a100_v6_feature_prep_forward.py
          python a100_v6_train_score_forward.py
          python a100_v7_forward_ranker.py
          python a100_forward_live.py

      - name: Update Forward Account V1
        run: |
          cd /mnt/data
          python a100_account_v1.py
          test -s /mnt/data/state/account_state.json
          test -s /mnt/data/state/trade_log.csv
          test -s /mnt/data/state/equity_curve.csv
          test -s /mnt/data/forward/account.json
          test -s /mnt/data/forward/account.html

      - name: Run A100 Autonomous Shadow controller
        run: |
          cd /mnt/data
          python a100_autonomous_shadow.py
          test -s /mnt/data/forward/autonomous/shadow_report.json
          test -s /mnt/data/forward/autonomous/shadow.html
          test -s /mnt/data/state/autonomous_journal.csv

      - name: Validate publish contract
        run: python scripts/validate_publish.py

      - name: Persist paper and autonomous state to repository
        run: |
          mkdir -p state
          cp -f /mnt/data/state/account_state.json state/account_state.json
          cp -f /mnt/data/state/trade_log.csv state/trade_log.csv
          cp -f /mnt/data/state/equity_curve.csv state/equity_curve.csv
          cp -f /mnt/data/state/autonomous_journal.csv state/autonomous_journal.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/account_state.json state/trade_log.csv state/equity_curve.csv state/autonomous_journal.csv
          if git diff --cached --quiet; then
            echo "No account-state changes to commit."
          else
            git commit -m "chore: update A100 Forward and autonomous state [skip ci]"
            git push origin HEAD:main
          fi

      - name: Copy sanitized outputs to Pages
        run: |
          mkdir -p site/autonomous
          cp /mnt/data/forward/index.html site/index.html
          cp /mnt/data/forward/latest_signal.json site/latest_signal.json
          cp /mnt/data/forward/latest_candidates.csv site/latest_candidates.csv
          cp /mnt/data/hithink_manifest.json site/data_manifest.json
          cp /mnt/data/forward/account.html site/account.html
          cp /mnt/data/forward/account.json site/account.json
          cp /mnt/data/forward/account_trades.csv site/account_trades.csv
          cp /mnt/data/forward/account_equity.csv site/account_equity.csv
          cp /mnt/data/forward/autonomous/shadow.html site/autonomous/index.html
          cp /mnt/data/forward/autonomous/shadow_report.json site/autonomous/shadow_report.json
          cp /mnt/data/forward/autonomous/shadow_allocations.csv site/autonomous/shadow_allocations.csv
          cp /mnt/data/forward/autonomous/shadow_rejections.csv site/autonomous/shadow_rejections.csv

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
