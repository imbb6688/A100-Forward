name: A100 Forward Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '10 8 * * 1-5'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'a100_iros/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/a100-forward.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: a100-forward
  cancel-in-progress: false

jobs:
  run-forward:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autonomous policy tests
        run: python -m unittest discover -s tests -v

      - name: A100 frozen preflight
        run: python scripts/preflight.py

      - name: Prepare runtime and restore account state
        run: |
          sudo mkdir -p /mnt/data/A100_complete_results /mnt/data/A100_v5_results /mnt/data/A100_v6_results /mnt/data/A100_v7_results /mnt/data/forward /mnt/data/state /mnt/data/state/iros-regime /mnt/data/iros_research /mnt/data/validation
          sudo chown -R $USER:$USER /mnt/data
          cp scripts/*.py /mnt/data/
          cp -a validation/. /mnt/data/validation/
          if [ -d state ]; then
            find state -maxdepth 1 -type f -print -exec cp -f {} /mnt/data/state/ \;
          fi
          if [ -d state/iros_research ]; then
            cp -a state/iros_research/. /mnt/data/iros_research/
          fi
          if [ -d state/iros-regime ]; then
            cp -a state/iros-regime/. /mnt/data/state/iros-regime/
          fi

      - name: Download and validate HiThink full market data
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          python scripts/download_hithink.py
          test -s /mnt/data/A100_2020_2026_raw.parquet
          test -s /mnt/data/A100_adjustment_factors.parquet
          test -s /mnt/data/hithink_manifest.json

      - name: Build frozen A100 feature chain
        run: |
          cd /mnt/data
          python a100_canonical_prep.py
          python a100_v5_pit_proxy.py
          python a100_v6_feature_prep_forward.py
          python a100_v6_train_score_forward.py
          python a100_v7_forward_ranker.py
          python a100_forward_live.py

      - name: Run Frozen V7 out-of-sample ranking evidence
        run: |
          python scripts/a100_v7_walk_forward_proxy.py
          test -s /mnt/data/validation/walk_forward_proxy_report.json
          test -s /mnt/data/validation/walk_forward_candidate_universe.csv

      - name: Enrich IROS Security Research Files
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          if python scripts/iros_enrich.py \
            --watchlist config/iros_watchlist.json \
            --root /mnt/data/iros_research; then
            touch /mnt/data/iros_enrichment_publish_ready
          else
            echo "::warning::IROS enrichment failed; previous valid research files will remain unchanged."
          fi

      - name: Build research-only Agentic AI regime
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          if python -m scripts.iros_agentic_ai_regime \
            --daily /mnt/data/A100_2020_2026_raw.parquet \
            --manifest /mnt/data/hithink_manifest.json \
            --input-output /mnt/data/state/iros-regime/inputs/latest.json \
            --output /mnt/data/state/iros-regime/latest.json \
            --history /mnt/data/state/iros-regime/history.jsonl; then
            touch /mnt/data/iros_regime_publish_ready
          else
            echo "::warning::Agentic AI regime quality gates failed; previous valid state will remain unpublished."
          fi
      - name: Update Forward Account V1
        run: |
          cd /mnt/data
          python a100_account_v1.py
          test -s /mnt/data/state/account_state.json
          test -s /mnt/data/state/trade_log.csv
          test -s /mnt/data/state/equity_curve.csv
          test -s /mnt/data/forward/account.json
          test -s /mnt/data/forward/account.html

      - name: Run A100 Autonomous Shadow controller
        run: |
          cd /mnt/data
          python a100_autonomous_shadow.py
          test -s /mnt/data/forward/autonomous/shadow_report.json
          test -s /mnt/data/forward/autonomous/shadow.html
          test -s /mnt/data/state/autonomous_journal.csv

      - name: Refresh data, risk and graduation evidence
        run: |
          python scripts/a100_data_inventory.py
          python scripts/a100_risk_scenarios.py
          python scripts/a100_graduation_gate.py
          test -s /mnt/data/forward/graduation_gate.json

      - name: Validate publish contract
        run: python scripts/validate_publish.py

      - name: Persist paper and autonomous state to repository
        run: |
          mkdir -p state
          cp -f /mnt/data/state/account_state.json state/account_state.json
          cp -f /mnt/data/state/trade_log.csv state/trade_log.csv
          cp -f /mnt/data/state/equity_curve.csv state/equity_curve.csv
          cp -f /mnt/data/state/autonomous_journal.csv state/autonomous_journal.csv
          if [ -f /mnt/data/iros_enrichment_publish_ready ]; then
            mkdir -p state/iros_research
            cp -a /mnt/data/iros_research/. state/iros_research/
          fi
          if [ -f /mnt/data/iros_regime_publish_ready ]; then
            mkdir -p state/iros-regime
            cp -a /mnt/data/state/iros-regime/. state/iros-regime/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/account_state.json state/trade_log.csv state/equity_curve.csv state/autonomous_journal.csv
          if [ -d state/iros_research ]; then
            git add state/iros_research
          fi
          if [ -d state/iros-regime ]; then
            git add state/iros-regime
          fi
          if git diff --cached --quiet; then
            echo "No account-state changes to commit."
          else
            git commit -m "chore: update A100 Forward and autonomous state [skip ci]"
            git push origin HEAD:main
          fi

      - name: Copy sanitized outputs to Pages
        run: |
          mkdir -p site/autonomous
          cp /mnt/data/forward/index.html site/index.html
          cp /mnt/data/forward/latest_signal.json site/latest_signal.json
          cp /mnt/data/forward/latest_candidates.csv site/latest_candidates.csv
          cp /mnt/data/hithink_manifest.json site/data_manifest.json
          cp /mnt/data/forward/account.html site/account.html
          cp /mnt/data/forward/account.json site/account.json
          cp /mnt/data/forward/account_trades.csv site/account_trades.csv
          cp /mnt/data/forward/account_equity.csv site/account_equity.csv
          cp /mnt/data/forward/autonomous/shadow.html site/autonomous/index.html
          cp /mnt/data/forward/autonomous/shadow_report.json site/autonomous/shadow_report.json
          cp /mnt/data/forward/autonomous/shadow_allocations.csv site/autonomous/shadow_allocations.csv
          cp /mnt/data/forward/autonomous/shadow_rejections.csv site/autonomous/shadow_rejections.csv
          cp /mnt/data/forward/graduation_gate.json site/graduation_gate.json
          cp /mnt/data/validation/walk_forward_proxy_report.json site/walk_forward_proxy_report.json
          cp /mnt/data/validation/walk_forward_candidate_universe.csv site/walk_forward_candidate_universe.csv
          if [ -f /mnt/data/iros_regime_publish_ready ]; then
            mkdir -p site/research/agentic-ai-regime
            cp /mnt/data/state/iros-regime/latest.json site/research/agentic-ai-regime/latest.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
