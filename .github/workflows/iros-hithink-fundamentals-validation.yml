name: A100 IROS HiThink Fundamentals Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/iros-hithink-fundamentals-v1
    paths:
      - 'a100_iros/hithink_fundamentals.py'
      - 'scripts/iros_hithink_fundamentals_probe.py'
      - 'tests/test_iros_hithink_fundamentals.py'
      - '.github/workflows/iros-hithink-fundamentals-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full unit tests
        run: python -m unittest discover -s tests -v

      - name: Probe real HiThink fundamentals and valuation
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          IROS_PROBE_TICKER: 600519.SH
          IROS_PROBE_PERIOD: annual
          IROS_PROBE_LIMIT: '5'
          IROS_PROBE_OUTPUT: iros_fundamentals_probe.json
        run: python scripts/iros_hithink_fundamentals_probe.py

      - name: Validate sanitized probe contract
        run: |
          test -s iros_fundamentals_probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('iros_fundamentals_probe.json').read_text(encoding='utf-8'))
          assert p['ticker'] == '600519.SH'
          assert len(p['income']) >= 1
          assert len(p['balance_sheet']) >= 1
          assert len(p['cash_flow']) >= 1
          assert isinstance(p['indicators'], dict) and p['indicators']
          assert isinstance(p['valuation'], dict)
          assert p['indicator_report']
          print(json.dumps({
              'ticker': p['ticker'],
              'indicator_report': p['indicator_report'],
              'income_rows': len(p['income']),
              'balance_sheet_rows': len(p['balance_sheet']),
              'cash_flow_rows': len(p['cash_flow']),
              'indicator_fields': sorted(p['indicators'].keys()),
              'valuation_fields': sorted(p['valuation'].keys()),
              'latest_report_date_ms': p['income'][0].get('report_date_ms'),
              'latest_period_end_ms': p['income'][0].get('period_end_ms'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload sanitized probe
        uses: actions/upload-artifact@v4
        with:
          name: iros-hithink-fundamentals-probe
          path: iros_fundamentals_probe.json
          retention-days: 7
