name: A100 Autonomous CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/autonomous-shadow-v1
      - fix/autonomous-empty-candidates
    paths:
      - 'scripts/a100_autonomous_*.py'
      - 'scripts/validate_publish.py'
      - 'tests/**'
      - '.github/workflows/a100-autonomous-ci.yml'
      - '.github/workflows/a100-forward.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autonomous policy tests
        run: python -m unittest discover -s tests -v

      - name: Compile autonomous modules and validators
        run: python -m py_compile scripts/a100_autonomous_policy.py scripts/a100_autonomous_shadow.py scripts/validate_publish.py
