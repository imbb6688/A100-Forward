name: A100 Recovery Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt PyYAML
      - name: Verify imports and YAML
        run: |
          python -c "import numpy,pandas,scipy,sklearn,requests,pyarrow"
          python -c "import pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]"
      - name: Recovery regression tests
        run: python -m unittest discover -s tests -v
