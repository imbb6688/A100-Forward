name: A100 Agentic AI Regime Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'
  pull_request:
    paths:
      - 'a100_iros/agentic_ai_regime.py'
      - 'scripts/iros_agentic_ai_regime.py'
      - 'config/agentic_ai_regime.json'
      - 'tests/test_iros_agentic_ai_regime.py'
      - '.github/workflows/iros-agentic-ai-regime.yml'

permissions:
  contents: read

jobs:
  regime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest tests.test_iros_agentic_ai_regime -v
      - name: Build daily regime snapshot
        run: python scripts/iros_agentic_ai_regime.py
      - name: Upload regime snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agentic-ai-regime
          path: |
            state/iros-regime/latest.json
            state/iros-regime/history.jsonl
